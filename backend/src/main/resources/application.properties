server.port=8080

# Application Configuration
spring.application.name=ai-interview-platform

# Default active profile
spring.profiles.active=mysql

# MySQL Configuration (Permanent Persistence)
spring.datasource.url=jdbc:mysql://localhost:3306/ai_interview_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:interview}
spring.datasource.password=${MYSQL_PASSWORD:interview123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# AI Configuration (supports 'gemini', 'openai', or 'mock')
ai.provider=${AI_PROVIDER:mock}
gemini.api.key=${GEMINI_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
